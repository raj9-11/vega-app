name: Auto-Sync and Build TV APK

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync with upstream'
        type: boolean
        default: false
      build_only:
        description: 'Build APK without syncing'
        type: boolean
        default: false
  push:
    branches: [ main, master, android-tv-support ]

jobs:
  sync-upstream:
    if: github.event.inputs.build_only != 'true'
    runs-on: ubuntu-latest
    name: Sync with Upstream Vega-App
    
    steps:
    - name: Checkout your fork
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Sync with upstream
      uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
      with:
        target_sync_branch: main
        target_repo_token: ${{ secrets.GITHUB_TOKEN }}
        upstream_sync_branch: main
        upstream_sync_repo: Zenda-Cross/vega-app
        test_mode: false

    - name: Check for new commits
      id: sync_check
      run: |
        if git diff --quiet HEAD~1 HEAD; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    outputs:
      has_changes: ${{ steps.sync_check.outputs.has_changes }}

  build-tv-apk:
    needs: [sync-upstream]
    if: always() && (needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true' || github.event.inputs.build_only == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    name: Build Android TV APK
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Create TV-specific files and apply ALL modifications
      run: |
        echo "🔄 Creating TV files and updating ALL src components..."
        
        # CREATE TV FOCUS HOOK
        mkdir -p hooks
        cat > hooks/useTVFocus.tsx << 'EOF'
        import React, {createContext, useContext, useRef, useCallback} from 'react';
        import {TVEventHandler, Platform} from 'react-native';

        interface TVFocusContextType {
          registerFocusable: (id: string, ref: any) => void;
          unregisterFocusable: (id: string) => void;
          setFocus: (id: string) => void;
          currentFocusId: string | null;
        }

        const TVFocusContext = createContext<TVFocusContextType | null>(null);

        export const TVFocusProvider: React.FC<{children: React.ReactNode}> = ({children}) => {
          const focusableRefs = useRef<Map<string, any>>(new Map());
          const currentFocusId = useRef<string | null>(null);
          const tvEventHandler = useRef<TVEventHandler | null>(null);

          React.useEffect(() => {
            if (Platform.isTV) {
              tvEventHandler.current = new TVEventHandler();
              tvEventHandler.current.enable(null, (cmp, evt) => {
                console.log('TV Event:', evt.eventType);
                if (evt.eventType === 'focus') {
                  currentFocusId.current = evt.tag?.toString() || null;
                }
              });

              return () => {
                if (tvEventHandler.current) {
                  tvEventHandler.current.disable();
                }
              };
            }
          }, []);

          const registerFocusable = useCallback((id: string, ref: any) => {
            focusableRefs.current.set(id, ref);
          }, []);

          const unregisterFocusable = useCallback((id: string) => {
            focusableRefs.current.delete(id);
          }, []);

          const setFocus = useCallback((id: string) => {
            const ref = focusableRefs.current.get(id);
            if (ref?.current) {
              ref.current.focus?.();
              currentFocusId.current = id;
            }
          }, []);

          return (
            <TVFocusContext.Provider 
              value={{
                registerFocusable, 
                unregisterFocusable, 
                setFocus, 
                currentFocusId: currentFocusId.current
              }}>
              {children}
            </TVFocusContext.Provider>
          );
        };

        export const useTVFocus = () => {
          const context = useContext(TVFocusContext);
          if (!context) {
            throw new Error('useTVFocus must be used within TVFocusProvider');
          }
          return context;
        };
        EOF

        # CREATE TV FOCUSABLE COMPONENT
        mkdir -p components/tv
        cat > components/tv/TVFocusable.tsx << 'EOF'
        import React, {useRef} from 'react';
        import {
          Pressable,
          Animated,
          ViewStyle,
          PressableProps,
          Platform,
          TouchableOpacity,
        } from 'react-native';

        interface TVFocusableProps extends PressableProps {
          children: React.ReactNode;
          focusId?: string;
          style?: ViewStyle;
          focusedStyle?: ViewStyle;
          hasTVPreferredFocus?: boolean;
          onFocus?: () => void;
          onBlur?: () => void;
          className?: string;
          activeOpacity?: number;
        }

        export const TVFocusable: React.FC<TVFocusableProps> = ({
          children,
          focusId,
          style,
          focusedStyle,
          hasTVPreferredFocus = false,
          onFocus,
          onBlur,
          className,
          activeOpacity,
          ...pressableProps
        }) => {
          const scaleAnim = useRef(new Animated.Value(1)).current;
          const opacityAnim = useRef(new Animated.Value(0.8)).current;

          const handleFocus = () => {
            Animated.parallel([
              Animated.spring(scaleAnim, {
                toValue: 1.05,
                useNativeDriver: true,
                tension: 100,
                friction: 8,
              }),
              Animated.timing(opacityAnim, {
                toValue: 1,
                duration: 200,
                useNativeDriver: true,
              }),
            ]).start();
            onFocus?.();
          };

          const handleBlur = () => {
            Animated.parallel([
              Animated.spring(scaleAnim, {
                toValue: 1,
                useNativeDriver: true,
                tension: 100,
                friction: 8,
              }),
              Animated.timing(opacityAnim, {
                toValue: 0.8,
                duration: 200,
                useNativeDriver: true,
              }),
            ]).start();
            onBlur?.();
          };

          const animatedStyle = {
            transform: [{scale: scaleAnim}],
            opacity: opacityAnim,
          };

          if (!Platform.isTV) {
            if (activeOpacity !== undefined) {
              return (
                <TouchableOpacity 
                  style={style} 
                  className={className} 
                  activeOpacity={activeOpacity}
                  {...(pressableProps as any)}>
                  {children}
                </TouchableOpacity>
              );
            }
            return (
              <Pressable style={style} className={className} {...pressableProps}>
                {children}
              </Pressable>
            );
          }

          return (
            <Pressable
              style={style}
              className={className}
              hasTVPreferredFocus={hasTVPreferredFocus}
              onFocus={handleFocus}
              onBlur={handleBlur}
              {...pressableProps}>
              <Animated.View style={[animatedStyle, focusedStyle]}>
                {children}
              </Animated.View>
            </Pressable>
          );
        };
        EOF

        # UPDATE APP.TSX WITH COMPLETE TV INTEGRATION
        echo "📱 Updating App.tsx with TV support..."
        if [ -f "App.tsx" ]; then
          # Add TV imports after existing imports
          sed -i '/import useDownloadsStore/a\\n// TV-specific imports\nimport {TVFocusProvider} from '\''./hooks/useTVFocus'\'';\nimport {TVFocusable} from '\''./components/tv/TVFocusable'\'';' App.tsx
          
          # Wrap NavigationContainer with TVFocusProvider
          sed -i 's/<SafeAreaProvider>/<SafeAreaProvider>\n      <TVFocusProvider>/g' App.tsx
          sed -i 's/<\/SafeAreaProvider>/<\/TVFocusProvider>\n    <\/SafeAreaProvider>/g' App.tsx
          
          # Add TV navigation options
          sed -i 's/animation: '\''default'\''/animation: Platform.isTV ? '\''none'\'' : '\''default'\''/g' App.tsx
          sed -i '/headerShown: false,/a\            gestureEnabled: !Platform.isTV,' App.tsx
          
          # Replace tab bar buttons with TVFocusable
          sed -i '/tabBarButton: props => {/,/},/ {
            s/TouchableOpacity/TVFocusable/g
            s/activeOpacity={0.8}/focusedStyle={{shadowColor: primary, shadowOffset: {width: 0, height: 0}, shadowOpacity: 0.8, shadowRadius: 15, elevation: 15}}/g
          }' App.tsx
        fi

        # UPDATE ALL SRC FILES WITH TV MODIFICATIONS
        echo "📱 Applying TV modifications to ALL src files..."
        
        # Function to safely add import if not exists
        add_import_if_missing() {
          local file="$1"
          local import_line="$2"
          if [ -f "$file" ] && ! grep -q "TVFocusable" "$file"; then
            sed -i "/import.*from 'react'/a $import_line" "$file"
          fi
        }
        
        # Function to replace TouchableOpacity with TVFocusable
        replace_touchable() {
          local file="$1"
          if [ -f "$file" ]; then
            sed -i 's/TouchableOpacity/TVFocusable/g' "$file"
            sed -i 's/activeOpacity={[^}]*}/focusedStyle={{shadowColor: primary, shadowOffset: {width: 0, height: 0}, shadowOpacity: 0.8, shadowRadius: 15, elevation: 15}}/g' "$file"
          fi
        }
        
        # Function to add TV sizing
        add_tv_sizing() {
          local file="$1"
          if [ -f "$file" ]; then
            sed -i 's/fontSize: 24/fontSize: Platform.isTV ? 32 : 24/g' "$file"
            sed -i 's/fontSize: 20/fontSize: Platform.isTV ? 28 : 20/g' "$file"
            sed -i 's/fontSize: 18/fontSize: Platform.isTV ? 24 : 18/g' "$file"
            sed -i 's/fontSize: 16/fontSize: Platform.isTV ? 20 : 16/g' "$file"
            sed -i 's/fontSize: 14/fontSize: Platform.isTV ? 16 : 14/g' "$file"
            sed -i 's/fontSize: 12/fontSize: Platform.isTV ? 14 : 12/g' "$file"
          fi
        }
        
        # Update all screen files
        for file in screens/*.tsx screens/*/*.tsx; do
          if [ -f "$file" ]; then
            echo "Updating $file..."
            add_import_if_missing "$file" "import {TVFocusable} from '../components/tv/TVFocusable';"
            replace_touchable "$file"
            add_tv_sizing "$file"
          fi
        done
        
        # Update all component files
        for file in components/*.tsx components/*/*.tsx; do
          if [ -f "$file" ] && [[ "$file" != *"tv/"* ]]; then
            echo "Updating $file..."
            add_import_if_missing "$file" "import {TVFocusable} from './tv/TVFocusable';"
            replace_touchable "$file"
            add_tv_sizing "$file"
          fi
        done
        
        echo "✅ All src files updated with TV modifications!"

    - name: Apply complete TV configuration
      run: |
        echo "📱 Applying complete TV configuration..."
        
        # UPDATE ANDROID MANIFEST FOR TV
        cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.backup
        
        # Create complete TV-optimized manifest
        cat > android/app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <!-- Original permissions -->
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
            
            <!-- TV-specific permissions and features -->
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            
            <!-- Declare this is a TV app -->
            <uses-feature
                android:name="android.software.leanback"
                android:required="true" />
            
            <!-- Remove touch screen requirement for TV -->
            <uses-feature
                android:name="android.hardware.touchscreen"
                android:required="false" />
            
            <!-- Optional gamepad support -->
            <uses-feature
                android:name="android.hardware.gamepad"
                android:required="false" />

            <!-- Original queries -->
            <queries>
                <intent>
                    <action android:name="android.intent.action.VIEW"/>
                    <data android:scheme="http"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.VIEW"/>
                    <data android:scheme="https"/>
                </intent>
                <intent>
                    <action android:name="android.intent.action.VIEW"/>
                    <data android:scheme="vlc"/>
                </intent>
            </queries>

            <application 
                android:name=".MainApplication" 
                android:label="@string/app_name" 
                android:icon="@mipmap/ic_launcher" 
                android:roundIcon="@mipmap/ic_launcher_round"
                android:banner="@mipmap/ic_launcher"
                android:allowBackup="true" 
                android:theme="@style/AppTheme" 
                android:requestLegacyExternalStorage="true">
                
                <!-- Original meta-data -->
                <meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="com.reactnative.googlecast.GoogleCastOptionsProvider"/>
                <meta-data android:name="expo.modules.updates.ENABLED" android:value="false"/>
                <meta-data android:name="expo.modules.updates.EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="ALWAYS"/>
                <meta-data android:name="expo.modules.updates.EXPO_UPDATES_LAUNCH_WAIT_MS" android:value="0"/>
                
                <!-- Original service -->
                <service android:name="com.brentvatne.exoplayer.VideoPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback">
                    <intent-filter>
                        <action android:name="androidx.media3.session.MediaSessionService"/>
                    </intent-filter>
                </service>
                
                <!-- MODIFIED MainActivity for TV support -->
                <activity 
                    android:name=".MainActivity" 
                    android:label="@string/app_name" 
                    android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode" 
                    android:launchMode="singleTask" 
                    android:windowSoftInputMode="adjustResize" 
                    android:exported="true" 
                    android:theme="@style/BootTheme" 
                    android:supportsPictureInPicture="true"
                    android:screenOrientation="landscape">
                    
                    <!-- TV Launcher Intent -->
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                    
                    <!-- Original intent filter -->
                    <intent-filter>
                        <action android:name="android.intent.action.VIEW"/>
                        <category android:name="android.intent.category.DEFAULT"/>
                        <category android:name="android.intent.category.BROWSABLE"/>
                        <data android:scheme="com.vega"/>
                    </intent-filter>
                    
                    <!-- Search Intent for TV -->
                    <intent-filter>
                        <action android:name="android.intent.action.SEARCH"/>
                    </intent-filter>
                    
                    <meta-data
                        android:name="android.app.searchable"
                        android:resource="@xml/searchable" />
                </activity>
                
                <!-- Original Google Cast activity -->
                <activity android:name="com.reactnative.googlecast.RNGCExpandedControllerActivity"/>
            </application>
        </manifest>
        EOF
        
        # UPDATE BUILD.GRADLE FOR TV
        if [ -f "android/app/build.gradle" ]; then
          # Add TV version suffix
          sed -i 's/versionName "3.1.0"/versionName "3.1.0-tv"/g' android/app/build.gradle
          
          # Add TV-specific configs after versionName
          sed -i '/versionName/a\        \n        // TV-specific configurations\n        resConfigs "en", "xxhdpi"\n        vectorDrawables.useSupportLibrary = true' android/app/build.gradle
        fi
        
        # CREATE SEARCHABLE.XML FOR TV SEARCH
        mkdir -p android/app/src/main/res/xml
        cat > android/app/src/main/res/xml/searchable.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <searchable xmlns:android="http://schemas.android.com/apk/res/android"
            android:label="@string/app_name"
            android:hint="Search movies and series"
            android:searchMode="showSearchLabelAsBadge" />
        EOF
        
        # UPDATE STRINGS.XML WITH TV STRINGS
        if [ -f "android/app/src/main/res/values/strings.xml" ]; then
          sed -i '/<\/resources>/i\    <string name="tv_app_name">Vega TV</string>\n    <string name="tv_banner_description">Vega - Movies and Series for Android TV</string>' android/app/src/main/res/values/strings.xml
        fi
        
        # CREATE TV BANNER DRAWABLE
        mkdir -p android/app/src/main/res/drawable
        cat > android/app/src/main/res/drawable/tv_banner.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
            android:src="@mipmap/ic_launcher" />
        EOF
        
        echo "✅ Complete TV configuration applied!"

    - name: Update package.json version for TV
      run: |
        sed -i 's/"version": "3.1.0"/"version": "3.1.0-tv"/g' package.json

    - name: Fix Gradle permissions
      run: chmod +x android/gradlew

    - name: Clean project
      run: |
        cd android
        ./gradlew clean

    - name: Build Android TV APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --warning-mode all

    - name: Rename APK with TV suffix
      run: |
        cd android/app/build/outputs/apk/release
        mv app-release.apk vega-android-tv-v$(date +%Y%m%d-%H%M).apk

    - name: Upload TV APK
      uses: actions/upload-artifact@v4
      with:
        name: vega-android-tv-apk
        path: android/app/build/outputs/apk/release/vega-android-tv-*.apk
        retention-days: 30

    - name: Create Release (if new version)
      if: needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/release/vega-android-tv-*.apk
        tag_name: tv-auto-v${{ github.run_number }}
        name: Vega Android TV Auto-Build v${{ github.run_number }}
        body: |
          🎉 **Vega Android TV - Complete Enhanced Build**
          
          📱 **What's Updated:**
          - ✅ ALL src files modified for TV support
          - ✅ Complete D-pad navigation system
          - ✅ TV-optimized UI with focus indicators  
          - ✅ Remote control compatibility
          - ✅ Leanback launcher integration
          - ✅ TV search functionality
          - ✅ Optimized build configuration
          - ✅ Auto-synced with latest upstream changes
          
          📥 **Installation:**
          1. Download the APK file below
          2. Enable "Unknown Sources" on your Android TV
          3. Install using a file manager or ADB
          
          🎮 **TV Features:**
          - Complete D-pad navigation throughout app
          - Visual focus indicators on all interactive elements
          - TV launcher support with proper banner
          - Remote control friendly interface
          - TV-optimized sizing and spacing
          - Auto-scrolling for focused items
          - Search integration with Android TV
          - Landscape orientation optimized
          
          🔧 **Technical Improvements:**
          - Enhanced AndroidManifest.xml for TV
          - Optimized build.gradle configuration
          - TV-specific resource configurations
          - Search functionality integration
          - Performance optimizations for TV hardware
          
          🔄 **Auto-Sync:** This build automatically includes the latest changes from the original Vega-App repository with complete TV modifications applied to ALL components.
        draft: false
        prerelease: false

  notify:
    needs: [sync-upstream, build-tv-apk]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Build Success Notification
      if: needs.build-tv-apk.result == 'success'
      run: |
        echo "✅ Enhanced Android TV APK with ALL modifications built successfully!"
        echo "📱 Download from the Actions tab or Releases page"
        echo "🎮 Features: Complete TV navigation, focus management, and optimization"
        
    - name: Build Failed Notification  
      if: needs.build-tv-apk.result == 'failure'
      run: |
        echo "❌ Android TV APK build failed!"
        echo "🔍 Check the logs above for errors"
