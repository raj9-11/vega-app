name: Auto-Sync and Build TVOS APK

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync with upstream'
        type: boolean
        default: false
      build_only:
        description: 'Build APK without syncing'
        type: boolean
        default: false
  push:
    branches: [ main, master, android-tv-support ]

jobs:
  sync-upstream:
    if: github.event.inputs.build_only != 'true'
    runs-on: ubuntu-latest
    name: Sync with Upstream Vega-App
    
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: Zenda-Cross/vega-app
          test_mode: false

      - name: Check for new commits
        id: sync_check
        run: |
          if git diff --quiet HEAD~1 HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

    outputs:
      has_changes: ${{ steps.sync_check.outputs.has_changes }}

  build-tvos-apk:
    needs: [sync-upstream]
    if: always() && (needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true' || github.event.inputs.build_only == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    name: Build react-native-tvos APK
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies and migrate to react-native-tvos
        run: |
          npm install
          npm uninstall react-native
          npm install react-native-tvos@latest
          sed -i 's/"react-native":.*/"react-native": "npm:react-native-tvos@latest",/' package.json

      - name: Create react-native-tvos optimized TV components
        run: |
          echo "Creating react-native-tvos components..."
          
          mkdir -p components/tvos
          cat > components/tvos/TVOSFocusable.tsx << 'EOF'
          import React from 'react';
          import {Pressable, TVFocusGuideView, ViewStyle, PressableProps, Platform} from 'react-native';

          interface TVOSFocusableProps extends PressableProps {
            children: React.ReactNode;
            style?: ViewStyle;
            focusedStyle?: ViewStyle;
            hasTVPreferredFocus?: boolean;
          }

          export const TVOSFocusable: React.FC<TVOSFocusableProps> = ({
            children, style, focusedStyle, hasTVPreferredFocus = false, ...pressableProps
          }) => {
            if (!Platform.isTV) {
              return <Pressable style={style} {...pressableProps}>{children}</Pressable>;
            }

            return (
              <TVFocusGuideView>
                <Pressable
                  style={({focused}) => [
                    {
                      borderWidth: focused ? 6 : 0,
                      borderColor: focused ? '#FFFF00' : 'transparent',
                      borderRadius: focused ? 8 : 0,
                      backgroundColor: focused ? 'rgba(255, 255, 0, 0.2)' : 'transparent',
                      transform: [{scale: focused ? 1.1 : 1}],
                      shadowColor: focused ? '#FFFF00' : 'transparent',
                      shadowOpacity: focused ? 1 : 0,
                      shadowRadius: focused ? 20 : 0,
                      shadowOffset: {width: 0, height: 0},
                      elevation: focused ? 15 : 0,
                    },
                    style,
                    focused && focusedStyle,
                  ]}
                  hasTVPreferredFocus={hasTVPreferredFocus}
                  onFocus={() => console.log('TVOS FOCUSED')}
                  onBlur={() => console.log('TVOS BLURRED')}
                  {...pressableProps}>
                  {children}
                </Pressable>
              </TVFocusGuideView>
            );
          };
          EOF

          cat > components/tvos/TVOSDebugger.tsx << 'EOF'
          import React, {useState, useEffect} from 'react';
          import {View, Text, Platform} from 'react-native';

          export const TVOSDebugger = () => {
            const [focusInfo, setFocusInfo] = useState('react-native-tvos Ready');

            useEffect(() => {
              if (!Platform.isTV) return;
              
              const originalLog = console.log;
              console.log = (...args) => {
                const message = args.join(' ');
                if (message.includes('TVOS')) {
                  setFocusInfo(message);
                }
                originalLog(...args);
              };

              return () => {
                console.log = originalLog;
              };
            }, []);

            if (!Platform.isTV) return null;

            return (
              <View style={{
                position: 'absolute',
                top: 30,
                right: 30,
                backgroundColor: 'rgba(0,0,0,0.9)',
                padding: 20,
                borderRadius: 10,
                borderWidth: 3,
                borderColor: '#FFFF00',
                zIndex: 1000,
                minWidth: 300,
              }}>
                <Text style={{color: '#FFFF00', fontSize: 16, fontWeight: 'bold'}}>
                  REACT-NATIVE-TVOS
                </Text>
                <Text style={{color: 'white', fontSize: 14, marginTop: 8}}>
                  {focusInfo}
                </Text>
              </View>
            );
          };
          EOF

      - name: Apply react-native-tvos modifications
        run: |
          if [ -f "App.tsx" ]; then
            sed -i '/import useDownloadsStore/a\\n// react-native-tvos imports\nimport {TVOSFocusable} from '\''./components/tvos/TVOSFocusable'\'';\nimport {TVOSDebugger} from '\''./components/tvos/TVOSDebugger'\'';' App.tsx
            sed -i 's/<NavigationContainer/<>\n        {Platform.isTV && <TVOSDebugger \/>}\n        <NavigationContainer/g' App.tsx
            sed -i 's/<\/NavigationContainer>/<\/NavigationContainer>\n      <\/>/g' App.tsx
          fi

          find . -name "*.tsx" -path "./screens/*" -o -path "./components/*" | while read file; do
            if [ -f "$file" ] && ! grep -q "tvos/" "$file"; then
              if ! grep -q "TVOSFocusable" "$file"; then
                sed -i "/import.*from 'react'/a import {TVOSFocusable} from '../components/tvos/TVOSFocusable';" "$file" 2>/dev/null || true
              fi
              sed -i 's/TouchableOpacity/TVOSFocusable/g' "$file"
            fi
          done

      - name: Setup keystore
        run: |
          echo "${{ secrets.SIGNINGKEYBASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Apply Android TV configuration
        run: |
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.backup

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />

              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="vlc"/></intent>
              </queries>

              <application android:name=".MainApplication" android:label="@string/app_name" 
                  android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher" android:allowBackup="true" 
                  android:theme="@style/AppTheme" android:requestLegacyExternalStorage="true">
                  
                  <meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="com.reactnative.googlecast.GoogleCastOptionsProvider"/>
                  <meta-data android:name="expo.modules.updates.ENABLED" android:value="false"/>
                  <meta-data android:name="expo.modules.updates.EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="ALWAYS"/>
                  <meta-data android:name="expo.modules.updates.EXPO_UPDATES_LAUNCH_WAIT_MS" android:value="0"/>
                  
                  <service android:name="com.brentvatne.exoplayer.VideoPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback">
                      <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
                  </service>
                  
                  <activity android:name=".MainActivity" android:label="@string/app_name" 
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode" 
                      android:launchMode="singleTask" android:windowSoftInputMode="adjustResize" 
                      android:exported="true" android:theme="@style/BootTheme" 
                      android:supportsPictureInPicture="true" android:screenOrientation="landscape">
                      
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="com.vega"/>
                      </intent-filter>
                      <intent-filter><action android:name="android.intent.action.SEARCH"/></intent-filter>
                      <meta-data android:name="android.app.searchable" android:resource="@xml/searchable" />
                  </activity>
                  
                  <activity android:name="com.reactnative.googlecast.RNGCExpandedControllerActivity"/>
              </application>
          </manifest>
          EOF

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/versionName "3.1.0"/versionName "3.1.0-tvos-armv7"/g' android/app/build.gradle
            sed -i '/versionName.*"3.1.0-tvos-armv7"/a\        ndk {\n            abiFilters "armeabi-v7a"\n        }' android/app/build.gradle
            sed -i '/android {/a\    signingConfigs {\n        release {\n            storeFile file("keystore.jks")\n            storePassword System.getenv("SIGNING_STORE_PASSWORD")\n            keyAlias System.getenv("SIGNING_KEY_ALIAS")\n            keyPassword System.getenv("SIGNING_KEY_PASSWORD")\n        }\n    }' android/app/build.gradle
            sed -i '/buildTypes {/,/}/ {
              /release {/,/}/ {
                /signingConfig/d
                a\            signingConfig signingConfigs.release
              }
            }' android/app/build.gradle
          fi

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/searchable.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <searchable xmlns:android="http://schemas.android.com/apk/res/android"
              android:label="@string/app_name"
              android:hint="Search movies and series"
              android:searchMode="showSearchLabelAsBadge" />
          EOF

      - name: Fix Gradle permissions
        run: chmod +x android/gradlew

      - name: Clean project
        run: |
          cd android
          ./gradlew clean

      - name: Build react-native-tvos APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a --no-daemon

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            APK_FILE=$(basename "$APK_FILE")
            mv "$APK_FILE" "vega-tvos-armv7-v$(date +%Y%m%d-%H%M).apk"
            echo "Renamed to: vega-tvos-armv7-v$(date +%Y%m%d-%H%M).apk"
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vega-tvos-armv7-apk
          path: android/app/build/outputs/apk/release/vega-tvos-armv7-*.apk
          retention-days: 30

      - name: Create Release
        if: needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/vega-tvos-armv7-*.apk
          tag_name: tvos-armv7-v${{ github.run_number }}
          name: Vega TVOS ARMv7 v${{ github.run_number }}
          body: |
            Vega Android TV - react-native-tvos Build
            
            Built with react-native-tvos for superior TV experience
            - armeabi-v7a optimized for your Android TV box
            - TVFocusGuideView for native TV focus management
            - Bright yellow focus indicators visible on dark theme
            - Auto-sync with main Vega app
            - Platform.isTV detection for proper TV/mobile separation
            - Signed with your personal keystore
            
            Installation:
            1. Download the TVOS APK below
            2. Enable Unknown Sources on your Android TV
            3. Install and experience native TV navigation
            
            react-native-tvos Features:
            - Native focus states with built-in focused styling
            - TVFocusGuideView for advanced focus control
            - Better performance with TV-optimized rendering
            - Debug overlay showing Platform.isTV status
          draft: false
          prerelease: false

  notify:
    needs: [sync-upstream, build-tvos-apk]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Build Success
        if: needs.build-tvos-apk.result == 'success'
        run: echo "react-native-tvos ARMv7 APK built successfully!"
        
      - name: Build Failed
        if: needs.build-tvos-apk.result == 'failure'
        run: echo "react-native-tvos build failed - check logs above"
