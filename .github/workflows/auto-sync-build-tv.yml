name: Auto-Sync and Build TV APK

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync with upstream'
        type: boolean
        default: false
      build_only:
        description: 'Build APK without syncing'
        type: boolean
        default: false
  push:
    branches: [ main, master, android-tv-support ]

jobs:
  sync-upstream:
    if: github.event.inputs.build_only != 'true'
    runs-on: ubuntu-latest
    name: Sync with Upstream Vega-App
    
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: Zenda-Cross/vega-app
          test_mode: false

      - name: Check for new commits
        id: sync_check
        run: |
          if git diff --quiet HEAD~1 HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

    outputs:
      has_changes: ${{ steps.sync_check.outputs.has_changes }}

  build-tv-apk:
    needs: [sync-upstream]
    if: always() && (needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true' || github.event.inputs.build_only == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    name: Build Android TV APK
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create enhanced TV-specific files
        run: |
          echo "🔄 Creating enhanced TV files..."
          
          mkdir -p hooks
          cat > hooks/useTVFocus.tsx << 'EOF'
          import React, {createContext, useContext, useRef, useCallback} from 'react';
          import {TVEventHandler, Platform} from 'react-native';

          interface TVFocusContextType {
            registerFocusable: (id: string, ref: any) => void;
            unregisterFocusable: (id: string) => void;
            setFocus: (id: string) => void;
            currentFocusId: string | null;
          }

          const TVFocusContext = createContext<TVFocusContextType | null>(null);

          export const TVFocusProvider: React.FC<{children: React.ReactNode}> = ({children}) => {
            const focusableRefs = useRef<Map<string, any>>(new Map());
            const currentFocusId = useRef<string | null>(null);
            const tvEventHandler = useRef<TVEventHandler | null>(null);

            React.useEffect(() => {
              if (Platform.isTV) {
                tvEventHandler.current = new TVEventHandler();
                tvEventHandler.current.enable(null, (cmp, evt) => {
                  if (evt.eventType === 'focus') {
                    currentFocusId.current = evt.tag?.toString() || null;
                  }
                });
                return () => {
                  if (tvEventHandler.current) {
                    tvEventHandler.current.disable();
                  }
                };
              }
            }, []);

            const registerFocusable = useCallback((id: string, ref: any) => {
              focusableRefs.current.set(id, ref);
            }, []);

            const unregisterFocusable = useCallback((id: string) => {
              focusableRefs.current.delete(id);
            }, []);

            const setFocus = useCallback((id: string) => {
              const ref = focusableRefs.current.get(id);
              if (ref?.current) {
                ref.current.focus?.();
                currentFocusId.current = id;
              }
            }, []);

            return (
              <TVFocusContext.Provider 
                value={{registerFocusable, unregisterFocusable, setFocus, currentFocusId: currentFocusId.current}}>
                {children}
              </TVFocusContext.Provider>
            );
          };

          export const useTVFocus = () => {
            const context = useContext(TVFocusContext);
            if (!context) {
              throw new Error('useTVFocus must be used within TVFocusProvider');
            }
            return context;
          };
          EOF

          mkdir -p components/tv
          cat > components/tv/TVFocusable.tsx << 'EOF'
          import React, {useRef} from 'react';
          import {Pressable, Animated, ViewStyle, PressableProps, Platform, TouchableOpacity} from 'react-native';

          interface TVFocusableProps extends PressableProps {
            children: React.ReactNode;
            focusId?: string;
            style?: ViewStyle;
            focusedStyle?: ViewStyle;
            hasTVPreferredFocus?: boolean;
            onFocus?: () => void;
            onBlur?: () => void;
            className?: string;
            activeOpacity?: number;
          }

          export const TVFocusable: React.FC<TVFocusableProps> = ({
            children, focusId, style, focusedStyle, hasTVPreferredFocus = false,
            onFocus, onBlur, className, activeOpacity, ...pressableProps
          }) => {
            const scaleAnim = useRef(new Animated.Value(1)).current;
            const borderAnim = useRef(new Animated.Value(0)).current;
            const glowAnim = useRef(new Animated.Value(0)).current;

            const handleFocus = () => {
              console.log('🎯 FOCUSED:', focusId || 'Item');
              Animated.parallel([
                Animated.spring(scaleAnim, {toValue: 1.15, useNativeDriver: true, tension: 80, friction: 5}),
                Animated.timing(borderAnim, {toValue: 1, duration: 150, useNativeDriver: false}),
                Animated.timing(glowAnim, {toValue: 1, duration: 150, useNativeDriver: false}),
              ]).start();
              onFocus?.();
            };

            const handleBlur = () => {
              console.log('🎯 BLURRED:', focusId || 'Item');
              Animated.parallel([
                Animated.spring(scaleAnim, {toValue: 1, useNativeDriver: true, tension: 80, friction: 5}),
                Animated.timing(borderAnim, {toValue: 0, duration: 150, useNativeDriver: false}),
                Animated.timing(glowAnim, {toValue: 0, duration: 150, useNativeDriver: false}),
              ]).start();
              onBlur?.();
            };

            const animatedStyle = {
              transform: [{scale: scaleAnim}],
              borderWidth: borderAnim.interpolate({inputRange: [0, 1], outputRange: [0, 6]}),
              borderColor: borderAnim.interpolate({inputRange: [0, 1], outputRange: ['transparent', '#00BFFF']}),
              shadowOpacity: glowAnim,
              shadowRadius: glowAnim.interpolate({inputRange: [0, 1], outputRange: [0, 25]}),
              shadowColor: '#00BFFF',
              shadowOffset: {width: 0, height: 0},
              elevation: glowAnim.interpolate({inputRange: [0, 1], outputRange: [0, 15]}),
              backgroundColor: glowAnim.interpolate({
                inputRange: [0, 1], 
                outputRange: ['transparent', 'rgba(0, 191, 255, 0.1)']
              }),
            };

            if (!Platform.isTV) {
              if (activeOpacity !== undefined) {
                return <TouchableOpacity style={style} className={className} activeOpacity={activeOpacity} {...(pressableProps as any)}>{children}</TouchableOpacity>;
              }
              return <Pressable style={style} className={className} {...pressableProps}>{children}</Pressable>;
            }

            return (
              <Pressable style={style} className={className} hasTVPreferredFocus={hasTVPreferredFocus} onFocus={handleFocus} onBlur={handleBlur} {...pressableProps}>
                <Animated.View style={[animatedStyle, focusedStyle]}>
                  {children}
                </Animated.View>
              </Pressable>
            );
          };
          EOF

          if [ -f "App.tsx" ]; then
            sed -i '/import useDownloadsStore/a\\n// TV-specific imports\nimport {TVFocusProvider} from '\''./hooks/useTVFocus'\'';\nimport {TVFocusable} from '\''./components/tv/TVFocusable'\'';' App.tsx
            sed -i 's/<SafeAreaProvider>/<SafeAreaProvider>\n      <TVFocusProvider>/g' App.tsx
            sed -i 's/<\/SafeAreaProvider>/<\/TVFocusProvider>\n    <\/SafeAreaProvider>/g' App.tsx
          fi

          for file in screens/*.tsx screens/*/*.tsx; do
            if [ -f "$file" ]; then
              if ! grep -q "TVFocusable" "$file"; then
                sed -i "/import.*from 'react'/a import {TVFocusable} from '../components/tv/TVFocusable';" "$file"
              fi
              sed -i 's/TouchableOpacity/TVFocusable/g' "$file"
            fi
          done

          for file in components/*.tsx components/*/*.tsx; do
            if [ -f "$file" ] && [[ "$file" != *"tv/"* ]]; then
              if ! grep -q "TVFocusable" "$file"; then
                sed -i "/import.*from 'react'/a import {TVFocusable} from './tv/TVFocusable';" "$file"
              fi
              sed -i 's/TouchableOpacity/TVFocusable/g' "$file"
            fi
          done

      - name: Setup keystore
        run: |
          echo "${{ secrets.SIGNINGKEYBASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Apply TV configuration
        run: |
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.backup

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />

              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="vlc"/></intent>
              </queries>

              <application android:name=".MainApplication" android:label="@string/app_name" 
                  android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher" android:allowBackup="true" 
                  android:theme="@style/AppTheme" android:requestLegacyExternalStorage="true">
                  
                  <meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="com.reactnative.googlecast.GoogleCastOptionsProvider"/>
                  <meta-data android:name="expo.modules.updates.ENABLED" android:value="false"/>
                  <meta-data android:name="expo.modules.updates.EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="ALWAYS"/>
                  <meta-data android:name="expo.modules.updates.EXPO_UPDATES_LAUNCH_WAIT_MS" android:value="0"/>
                  
                  <service android:name="com.brentvatne.exoplayer.VideoPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback">
                      <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
                  </service>
                  
                  <activity android:name=".MainActivity" android:label="@string/app_name" 
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode" 
                      android:launchMode="singleTask" android:windowSoftInputMode="adjustResize" 
                      android:exported="true" android:theme="@style/BootTheme" 
                      android:supportsPictureInPicture="true" android:screenOrientation="landscape">
                      
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="com.vega"/>
                      </intent-filter>
                      <intent-filter><action android:name="android.intent.action.SEARCH"/></intent-filter>
                      <meta-data android:name="android.app.searchable" android:resource="@xml/searchable" />
                  </activity>
                  
                  <activity android:name="com.reactnative.googlecast.RNGCExpandedControllerActivity"/>
              </application>
          </manifest>
          EOF

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/versionName "3.1.0"/versionName "3.1.0-tv-armv7"/g' android/app/build.gradle
            sed -i '/versionName.*"3.1.0-tv-armv7"/a\        ndk {\n            abiFilters "armeabi-v7a"\n        }' android/app/build.gradle
            sed -i '/android {/a\    signingConfigs {\n        release {\n            storeFile file("keystore.jks")\n            storePassword System.getenv("SIGNING_STORE_PASSWORD")\n            keyAlias System.getenv("SIGNING_KEY_ALIAS")\n            keyPassword System.getenv("SIGNING_KEY_PASSWORD")\n        }\n    }' android/app/build.gradle
            sed -i '/buildTypes {/,/}/ {
              /release {/,/}/ {
                /signingConfig/d
                a\            signingConfig signingConfigs.release
              }
            }' android/app/build.gradle
          fi

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/searchable.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <searchable xmlns:android="http://schemas.android.com/apk/res/android"
              android:label="@string/app_name"
              android:hint="Search movies and series"
              android:searchMode="showSearchLabelAsBadge" />
          EOF

      - name: Fix Gradle permissions
        run: chmod +x android/gradlew

      - name: Clean project
        run: |
          cd android
          ./gradlew clean

      - name: Build armeabi-v7a APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a --no-daemon

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            APK_FILE=$(basename "$APK_FILE")
            mv "$APK_FILE" "vega-tv-armv7-enhanced-v$(date +%Y%m%d-%H%M).apk"
            echo "✅ Renamed to: vega-tv-armv7-enhanced-v$(date +%Y%m%d-%H%M).apk"
          else
            echo "❌ No APK found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vega-tv-armv7-enhanced-apk
          path: android/app/build/outputs/apk/release/vega-tv-armv7-enhanced-*.apk
          retention-days: 30

      - name: Create Release
        if: needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/vega-tv-armv7-enhanced-*.apk
          tag_name: tv-armv7-v${{ github.run_number }}
          name: Vega TV ARMv7 Enhanced v${{ github.run_number }}
          body: |
            🎉 Vega Android TV - ARMv7 Enhanced Focus Build
            
            📱 Built specifically for armeabi-v7a Android TV boxes
            ✅ Enhanced focus indicators with bright cyan borders  
            ✅ Complete D-pad navigation system
            ✅ TV launcher integration
            ✅ Signed with your personal keystore
            
            📥 Installation:
            1. Download the ARMv7 APK below
            2. Enable Unknown Sources on your Android TV  
            3. Install using file manager or ADB
            
            🎮 Enhanced Focus Features:
            - Cyan borders - 6px thick, highly visible
            - Scale animation - Items grow 15% when focused
            - Glow effects - Shadow and elevation for depth
            - Better contrast for TV viewing distance
          draft: false
          prerelease: false

  notify:
    needs: [sync-upstream, build-tv-apk]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Build Success
        if: needs.build-tv-apk.result == 'success'
        run: echo "✅ ARMv7 Android TV APK built successfully!"
        
      - name: Build Failed
        if: needs.build-tv-apk.result == 'failure'
        run: echo "❌ Build failed - check logs above"
