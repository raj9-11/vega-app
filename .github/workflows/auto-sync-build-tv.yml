name: Auto-Sync and Build TV APK

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync with upstream'
        type: boolean
        default: false
      build_only:
        description: 'Build APK without syncing'
        type: boolean
        default: false
  push:
    branches: [ main, master, android-tv-support ]

jobs:
  sync-upstream:
    if: github.event.inputs.build_only != 'true'
    runs-on: ubuntu-latest
    name: Sync with Upstream Vega-App
    
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: Zenda-Cross/vega-app
          test_mode: false

      - name: Check for new commits
        id: sync_check
        run: |
          if git diff --quiet HEAD~1 HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

    outputs:
      has_changes: ${{ steps.sync_check.outputs.has_changes }}

  build-tv-apk:
    needs: [sync-upstream]
    if: always() && (needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true' || github.event.inputs.build_only == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    name: Build Android TV APK
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create enhanced TV-specific files with better focus indicators
        run: |
          echo "🔄 Creating enhanced TV files with better focus visibility..."
          
          # CREATE TV FOCUS HOOK
          mkdir -p hooks
          cat > hooks/useTVFocus.tsx << 'EOF'
          import React, {createContext, useContext, useRef, useCallback} from 'react';
          import {TVEventHandler, Platform} from 'react-native';

          interface TVFocusContextType {
            registerFocusable: (id: string, ref: any) => void;
            unregisterFocusable: (id: string) => void;
            setFocus: (id: string) => void;
            currentFocusId: string | null;
          }

          const TVFocusContext = createContext<TVFocusContextType | null>(null);

          export const TVFocusProvider: React.FC<{children: React.ReactNode}> = ({children}) => {
            const focusableRefs = useRef<Map<string, any>>(new Map());
            const currentFocusId = useRef<string | null>(null);
            const tvEventHandler = useRef<TVEventHandler | null>(null);

            React.useEffect(() => {
              if (Platform.isTV) {
                tvEventHandler.current = new TVEventHandler();
                tvEventHandler.current.enable(null, (cmp, evt) => {
                  console.log('TV Event:', evt.eventType);
                  if (evt.eventType === 'focus') {
                    currentFocusId.current = evt.tag?.toString() || null;
                  }
                });
                return () => {
                  if (tvEventHandler.current) {
                    tvEventHandler.current.disable();
                  }
                };
              }
            }, []);

            const registerFocusable = useCallback((id: string, ref: any) => {
              focusableRefs.current.set(id, ref);
            }, []);

            const unregisterFocusable = useCallback((id: string) => {
              focusableRefs.current.delete(id);
            }, []);

            const setFocus = useCallback((id: string) => {
              const ref = focusableRefs.current.get(id);
              if (ref?.current) {
                ref.current.focus?.();
                currentFocusId.current = id;
              }
            }, []);

            return (
              <TVFocusContext.Provider 
                value={{
                  registerFocusable, 
                  unregisterFocusable, 
                  setFocus, 
                  currentFocusId: currentFocusId.current
                }}>
                {children}
              </TVFocusContext.Provider>
            );
          };

          export const useTVFocus = () => {
            const context = useContext(TVFocusContext);
            if (!context) {
              throw new Error('useTVFocus must be used within TVFocusProvider');
            }
            return context;
          };
          EOF

          # CREATE ENHANCED TV FOCUSABLE COMPONENT WITH BETTER VISIBILITY
          mkdir -p components/tv
          cat > components/tv/TVFocusable.tsx << 'EOF'
          import React, {useRef} from 'react';
          import {Pressable, Animated, ViewStyle, PressableProps, Platform, TouchableOpacity} from 'react-native';

          interface TVFocusableProps extends PressableProps {
            children: React.ReactNode;
            focusId?: string;
            style?: ViewStyle;
            focusedStyle?: ViewStyle;
            hasTVPreferredFocus?: boolean;
            onFocus?: () => void;
            onBlur?: () => void;
            className?: string;
            activeOpacity?: number;
          }

          export const TVFocusable: React.FC<TVFocusableProps> = ({
            children, focusId, style, focusedStyle, hasTVPreferredFocus = false,
            onFocus, onBlur, className, activeOpacity, ...pressableProps
          }) => {
            const scaleAnim = useRef(new Animated.Value(1)).current;
            const borderAnim = useRef(new Animated.Value(0)).current;
            const glowAnim = useRef(new Animated.Value(0)).current;

            const handleFocus = () => {
              console.log('🎯 FOCUSED:', focusId || 'Item');
              Animated.parallel([
                Animated.spring(scaleAnim, {toValue: 1.15, useNativeDriver: true, tension: 80, friction: 5}),
                Animated.timing(borderAnim, {toValue: 1, duration: 150, useNativeDriver: false}),
                Animated.timing(glowAnim, {toValue: 1, duration: 150, useNativeDriver: false}),
              ]).start();
              onFocus?.();
            };

            const handleBlur = () => {
              console.log('🎯 BLURRED:', focusId || 'Item');
              Animated.parallel([
                Animated.spring(scaleAnim, {toValue: 1, useNativeDriver: true, tension: 80, friction: 5}),
                Animated.timing(borderAnim, {toValue: 0, duration: 150, useNativeDriver: false}),
                Animated.timing(glowAnim, {toValue: 0, duration: 150, useNativeDriver: false}),
              ]).start();
              onBlur?.();
            };

            const animatedStyle = {
              transform: [{scale: scaleAnim}],
              borderWidth: borderAnim.interpolate({inputRange: [0, 1], outputRange: [0, 6]}),
              borderColor: borderAnim.interpolate({inputRange: [0, 1], outputRange: ['transparent', '#00BFFF']}),
              shadowOpacity: glowAnim,
              shadowRadius: glowAnim.interpolate({inputRange: [0, 1], outputRange: [0, 25]}),
              shadowColor: '#00BFFF',
              shadowOffset: {width: 0, height: 0},
              elevation: glowAnim.interpolate({inputRange: [0, 1], outputRange: [0, 15]}),
              backgroundColor: glowAnim.interpolate({
                inputRange: [0, 1], 
                outputRange: ['transparent', 'rgba(0, 191, 255, 0.1)']
              }),
            };

            if (!Platform.isTV) {
              if (activeOpacity !== undefined) {
                return (
                  <TouchableOpacity 
                    style={style} 
                    className={className} 
                    activeOpacity={activeOpacity}
                    {...(pressableProps as any)}>
                    {children}
                  </TouchableOpacity>
                );
              }
              return (
                <Pressable style={style} className={className} {...pressableProps}>
                  {children}
                </Pressable>
              );
            }

            return (
              <Pressable
                style={style}
                className={className}
                hasTVPreferredFocus={hasTVPreferredFocus}
                onFocus={handleFocus}
                onBlur={handleBlur}
                {...pressableProps}>
                <Animated.View style={[animatedStyle, focusedStyle]}>
                  {children}
                </Animated.View>
              </Pressable>
            );
          };
          EOF

          # CREATE FOCUS DEBUGGER COMPONENT
          cat > components/tv/FocusDebugger.tsx << 'EOF'
          import React, {useState, useEffect} from 'react';
          import {View, Text, Platform} from 'react-native';

          export const FocusDebugger = () => {
            const [currentFocus, setCurrentFocus] = useState('No focus detected');

            useEffect(() => {
              if (!Platform.isTV) return;
              
              let focusCount = 0;
              const originalLog = console.log;
              
              console.log = (...args) => {
                const message = args.join(' ');
                if (message.includes('🎯 FOCUSED:') || message.includes('🎯 BLURRED:')) {
                  focusCount++;
                  setCurrentFocus(`${message} (${focusCount})`);
                }
                originalLog(...args);
              };

              return () => {
                console.log = originalLog;
              };
            }, []);

            if (!Platform.isTV) return null;

            return (
              <View style={{
                position: 'absolute',
                top: 20,
                right: 20,
                backgroundColor: 'rgba(0,0,0,0.9)',
                padding: 15,
                borderRadius: 8,
                borderWidth: 2,
                borderColor: '#00BFFF',
                zIndex: 1000,
                minWidth: 250,
              }}>
                <Text style={{color: '#00BFFF', fontSize: 14, fontWeight: 'bold'}}>
                  TV FOCUS DEBUG
                </Text>
                <Text style={{color: 'white', fontSize: 12, marginTop: 5}}>
                  {currentFocus}
                </Text>
              </View>
            );
          };
          EOF

          # UPDATE APP.TSX WITH COMPLETE TV INTEGRATION
          echo "📱 Updating App.tsx with TV support..."
          if [ -f "App.tsx" ]; then
            # Add TV imports after existing imports
            sed -i '/import useDownloadsStore/a\\n// TV-specific imports\nimport {TVFocusProvider} from '\''./hooks/useTVFocus'\'';\nimport {TVFocusable} from '\''./components/tv/TVFocusable'\'';\nimport {FocusDebugger} from '\''./components/tv/FocusDebugger'\'';' App.tsx

            # Wrap NavigationContainer with TVFocusProvider
            sed -i 's/<SafeAreaProvider>/<SafeAreaProvider>\n      <TVFocusProvider>/g' App.tsx
            sed -i 's/<\/SafeAreaProvider>/<\/TVFocusProvider>\n    <\/SafeAreaProvider>/g' App.tsx

            # Add FocusDebugger to the main component
            sed -i 's/<NavigationContainer/<>\n        {Platform.isTV && <FocusDebugger \/>}\n        <NavigationContainer/g' App.tsx
            sed -i 's/<\/NavigationContainer>/<\/NavigationContainer>\n      <\/>/g' App.tsx

            # Add TV navigation options
            sed -i 's/animation: '\''default'\''/animation: Platform.isTV ? '\''none'\'' : '\''default'\''/g' App.tsx
            sed -i '/headerShown: false,/a\            gestureEnabled: !Platform.isTV,' App.tsx
          fi

          # UPDATE ALL SRC FILES WITH TV MODIFICATIONS
          echo "📱 Applying TV modifications to ALL src files..."

          # Update all screen files
          for file in screens/*.tsx screens/*/*.tsx; do
            if [ -f "$file" ]; then
              echo "Updating $file..."
              if ! grep -q "TVFocusable" "$file"; then
                sed -i "/import.*from 'react'/a import {TVFocusable} from '../components/tv/TVFocusable';" "$file"
              fi
              sed -i 's/TouchableOpacity/TVFocusable/g' "$file"
              sed -i 's/fontSize: 24/fontSize: Platform.isTV ? 32 : 24/g' "$file"
              sed -i 's/fontSize: 20/fontSize: Platform.isTV ? 28 : 20/g' "$file"
              sed -i 's/fontSize: 18/fontSize: Platform.isTV ? 24 : 18/g' "$file"
              sed -i 's/fontSize: 16/fontSize: Platform.isTV ? 20 : 16/g' "$file"
              sed -i 's/fontSize: 14/fontSize: Platform.isTV ? 16 : 14/g' "$file"
              sed -i 's/fontSize: 12/fontSize: Platform.isTV ? 14 : 12/g' "$file"
            fi
          done

          # Update all component files
          for file in components/*.tsx components/*/*.tsx; do
            if [ -f "$file" ] && [[ "$file" != *"tv/"* ]]; then
              echo "Updating $file..."
              if ! grep -q "TVFocusable" "$file"; then
                sed -i "/import.*from 'react'/a import {TVFocusable} from './tv/TVFocusable';" "$file"
              fi
              sed -i 's/TouchableOpacity/TVFocusable/g' "$file"
              sed -i 's/fontSize: 18/fontSize: Platform.isTV ? 24 : 18/g' "$file"
              sed -i 's/fontSize: 16/fontSize: Platform.isTV ? 20 : 16/g' "$file"
              sed -i 's/fontSize: 14/fontSize: Platform.isTV ? 16 : 14/g' "$file"
            fi
          done

          echo "✅ All src files updated with enhanced TV modifications!"

      - name: Setup keystore from GitHub secrets
        run: |
          echo "🔑 Setting up keystore from GitHub secrets..."
          echo "${{ secrets.SIGNINGKEYBASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Apply complete TV configuration
        run: |
          echo "📱 Applying complete TV configuration..."

          # UPDATE ANDROID MANIFEST FOR TV
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.backup

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.gamepad" android:required="false" />

              <queries>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="vlc"/></intent>
              </queries>

              <application android:name=".MainApplication" android:label="@string/app_name" 
                  android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
                  android:banner="@mipmap/ic_launcher" android:allowBackup="true" 
                  android:theme="@style/AppTheme" android:requestLegacyExternalStorage="true">
                  
                  <meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="com.reactnative.googlecast.GoogleCastOptionsProvider"/>
                  <meta-data android:name="expo.modules.updates.ENABLED" android:value="false"/>
                  <meta-data android:name="expo.modules.updates.EXPO_UPDATES_CHECK_ON_LAUNCH" android:value="ALWAYS"/>
                  <meta-data android:name="expo.modules.updates.EXPO_UPDATES_LAUNCH_WAIT_MS" android:value="0"/>
                  
                  <service android:name="com.brentvatne.exoplayer.VideoPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback">
                      <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
                  </service>
                  
                  <activity android:name=".MainActivity" android:label="@string/app_name" 
                      android:configChanges="keyboard|keyboardHidden|orientation|screenLayout|screenSize|smallestScreenSize|uiMode" 
                      android:launchMode="singleTask" android:windowSoftInputMode="adjustResize" 
                      android:exported="true" android:theme="@style/BootTheme" 
                      android:supportsPictureInPicture="true" android:screenOrientation="landscape">
                      
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="com.vega"/>
                      </intent-filter>
                      <intent-filter><action android:name="android.intent.action.SEARCH"/></intent-filter>
                      <meta-data android:name="android.app.searchable" android:resource="@xml/searchable" />
                  </activity>
                  
                  <activity android:name="com.reactnative.googlecast.RNGCExpandedControllerActivity"/>
              </application>
          </manifest>
          EOF

          # UPDATE BUILD.GRADLE FOR TV WITH KEYSTORE
          if [ -f "android/app/build.gradle" ]; then
            # Add TV version suffix
            sed -i 's/versionName "3.1.0"/versionName "3.1.0-tv-enhanced"/g' android/app/build.gradle

            # Add TV-specific configs
            sed -i '/versionName.*"3.1.0-tv-enhanced"/a\        \n        // TV-specific configurations\n        resConfigs "en"\n        vectorDrawables.useSupportLibrary = true' android/app/build.gradle

            # Add signing configuration using GitHub secrets
            sed -i '/android {/a\    signingConfigs {\n        release {\n            storeFile file("keystore.jks")\n            storePassword System.getenv("SIGNING_STORE_PASSWORD")\n            keyAlias System.getenv("SIGNING_KEY_ALIAS")\n            keyPassword System.getenv("SIGNING_KEY_PASSWORD")\n        }\n    }' android/app/build.gradle

            # Update release buildType to use signing config
            sed -i '/buildTypes {/,/}/ {
              /release {/,/}/ {
                /signingConfig/d
                a\            signingConfig signingConfigs.release
              }
            }' android/app/build.gradle
          fi

          # CREATE SEARCHABLE.XML FOR TV SEARCH
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/searchable.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <searchable xmlns:android="http://schemas.android.com/apk/res/android"
              android:label="@string/app_name"
              android:hint="Search movies and series"
              android:searchMode="showSearchLabelAsBadge" />
          EOF

          # UPDATE STRINGS.XML WITH TV STRINGS
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i '/<\/resources>/i\    <string name="tv_app_name">Vega TV Enhanced</string>\n    <string name="tv_banner_description">Vega - Movies and Series for Android TV with Enhanced Focus</string>' android/app/src/main/res/values/strings.xml
          fi

          # CREATE TV BANNER DRAWABLE
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/tv_banner.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@mipmap/ic_launcher" />
          EOF

          echo "✅ Complete TV configuration applied!"

      - name: Update package.json version for TV
        run: |
          sed -i 's/"version": "3.1.0"/"version": "3.1.0-tv-enhanced"/g' package.json

      - name: Fix Gradle permissions
        run: chmod +x android/gradlew

      - name: Clean project
        run: |
          cd android
          ./gradlew clean

      - name: Build Android TV APK with enhanced focus
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --warning-mode all

      - name: Find and rename enhanced TV APK
        run: |
          echo "🔍 Searching for enhanced TV APK..."
          
          cd android/app/build/outputs/apk/release
          
          # List all files to debug
          echo "📁 Files in release directory:"
          ls -la
          
          # Find any APK file
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          
          if [ -n "$APK_FILE" ]; then
            echo "✅ Found APK: $APK_FILE"
            APK_FILE=$(basename "$APK_FILE")
            mv "$APK_FILE" "vega-android-tv-enhanced-v$(date +%Y%m%d-%H%M).apk"
            echo "✅ Renamed to: vega-android-tv-enhanced-v$(date +%Y%m%d-%H%M).apk"
          else
            echo "❌ No APK file found in release directory"
            echo "🔍 Searching all build outputs..."
            find ../../.. -name "*.apk" -type f
            exit 1
          fi

      - name: Upload enhanced TV APK
        uses: actions/upload-artifact@v4
        with:
          name: vega-android-tv-enhanced-apk
          path: android/app/build/outputs/apk/release/vega-android-tv-enhanced-*.apk
          retention-days: 30

      - name: Create Release (if new version)
        if: needs.sync-upstream.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/vega-android-tv-enhanced-*.apk
          tag_name: tv-enhanced-v${{ github.run_number }}
          name: Vega Android TV Enhanced Focus v${{ github.run_number }}
          body: |
            🎉 **Vega Android TV - Enhanced Focus Visibility Build**
            
            📱 **What's New in This Build:**
            - ✅ **ENHANCED FOCUS INDICATORS** - Bright cyan borders and glow effects
            - ✅ **LARGER SCALE ANIMATION** - 15% size increase when focused
            - ✅ **FOCUS DEBUGGER** - On-screen display showing current focus
            - ✅ **CONSOLE LOGGING** - Debug focus events in logcat
            - ✅ **BETTER VISUAL FEEDBACK** - Background tint when focused
            - ✅ **ALL src files modified for TV support**
            - ✅ **Complete D-pad navigation system**
            - ✅ **TV-optimized UI with enhanced focus indicators**
            - ✅ **Remote control compatibility**
            - ✅ **Leanback launcher integration**
            - ✅ **Auto-synced with latest upstream changes**
            - ✅ **Signed with your personal keystore**
            
            📥 **Installation:**
            1. Download the enhanced APK file below
            2. Enable "Unknown Sources" on your Android TV
            3. Install using a file manager or ADB
            
            🎮 **Enhanced TV Features:**
            - **Bright cyan focus borders** - 6px thick, highly visible
            - **Scale animation** - Items grow 15% when focused
            - **Glow effects** - Shadow and elevation for depth
            - **Background tint** - Subtle blue background when focused
            - **Debug overlay** - Shows current focus state in top-right
            - **Console logging** - Track focus events via ADB logcat
            - **Complete D-pad navigation** throughout app
            - **TV launcher support** with proper banner
            - **Remote control friendly** interface
            
            🔧 **Focus Debugging:**
            - **Visual Debug Panel** - Top-right corner shows focus events
            - **Console Logs** - Use `adb logcat | grep "🎯"` to see focus events
            - **Color Coding** - Cyan (#00BFFF) for high visibility
            - **Animation Feedback** - Smooth transitions for better UX
            
            🔄 **Auto-Sync:** This build automatically includes the latest changes from the original Vega-App repository with complete TV modifications applied to ALL components.
          draft: false
          prerelease: false

  notify:
    needs: [sync-upstream, build-tv-apk]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Build Success Notification
        if: needs.build-tv-apk.result == 'success'
        run: |
          echo "✅ Enhanced Android TV APK with focus visibility improvements built successfully!"
          echo "📱 Download from the Actions tab or Releases page"
          echo "🎮 Features: Enhanced focus indicators, debug overlay, and better visibility"
          
      - name: Build Failed Notification
        if: needs.build-tv-apk.result == 'failure'
        run: |
          echo "❌ Android TV APK build failed!"
          echo "🔍 Check the logs above for errors"
